# The import tiler (server.mjs). Only the tiles Worker calls it, with GC_importTiler_key (`fly secrets set`).
app = "getcache-import-tiler"
primary_region = "sea"

[http_service]
  internal_port = 8080
  force_https = true
  # Imports are rare: no machine runs between them.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
