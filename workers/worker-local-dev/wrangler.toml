name = "offline-tiles"
main = "src/index.ts"
compatibility_date = "2026-06-02"

# ⚠️ `routes` is a top-level key — MUST sit above every [table] header or TOML nests it.
routes = [
  { pattern = "tiles-prod.getcache.org", custom_domain = true }
]

# /hospitals reads the world pack BUNDLED into the script (src/hospitalsWorld.v*.bin,
# baked by ../bakeHospitals.mjs) — the R2 bucket stays roads-only.
rules = [
  { type = "Data", globs = ["**/*.bin"], fallthrough = true }
]

# ⛔ NEVER create tiles-prod / tiles-dev by hand in the Cloudflare dashboard — `custom_domain = true` won't adopt an existing record; deploy fails with code 100117 and there is no --force (delete the record, then deploy).
# `remote = true`: `wrangler dev` runs the Worker on this machine but reads the
# REAL bucket — there is no local copy of the planet, so no local simulator.
# Needs `wrangler login` (or CLOUDFLARE_API_TOKEN with R2 read).
[[r2_buckets]]
binding = "TILES"
bucket_name = "offline-tiles"
remote = true

# Prod's own satellite cache and meter. Its switches stay at their defaults: no SQUIRREL_WRITES here, so no
# one can flip what every shipped phone bakes, and testing Squirrel on tiles-dev never reaches prod.
[[r2_buckets]]
binding = "SAT_CACHE"
bucket_name = "gc-satellite-cache-prod"

# Counts only, shared with tiles-dev: both spend the same MapTiler and Esri keys, so one meter holds the 90% stops.
[[r2_buckets]]
binding = "METER"
bucket_name = "gc-satellite-cache"

# ⚠️ PMTILES_KEY must match the uploaded object key in the
# bucket — a mismatch silently reads as "no tiles".
[vars]
PMTILES_KEY = "planet.pmtiles"
# No written permission from MapTiler to keep its tiles on prod; USGS and the rest still cache.
R2_NEVER = "maptiler"

[env.dev]
name = "offline-tiles-dev"
routes = [
  { pattern = "tiles-dev.getcache.org", custom_domain = true }
]

[[env.dev.r2_buckets]]
binding = "TILES"
bucket_name = "offline-tiles"

# Satellite tiles every phone shares, plus Squirrel's counts and switches.
[[env.dev.r2_buckets]]
binding = "SAT_CACHE"
bucket_name = "gc-satellite-cache"

[[env.dev.r2_buckets]]
binding = "METER"
bucket_name = "gc-satellite-cache"

[env.dev.vars]
PMTILES_KEY = "planet.pmtiles"
SQUIRREL_WRITES = "on"
# Top-level vars don't reach an env, so dev names it too: no written permission covers either Worker.
R2_NEVER = "maptiler"

# ⚠️ a staging Worker (offline-tiles-staging) may still exist in Cloudflare — deleting config never tears down a live Worker.
